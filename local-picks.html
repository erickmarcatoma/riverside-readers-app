<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Picks & Staff Favorites - Riverside Books</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>

  <!-- Top Navigation -->
  <header class="navbar">
    <div class="nav-brand">
      <img src="riversidebook.png" alt="Riverside Books Logo" class="brand-logo-img">
      <div class="brand-text">
        <span class="brand-title">RIVERSIDE BOOKS</span>
        <span class="brand-subtitle">INDEPENDENT & LOCAL</span>
      </div>
    </div>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop Books</a>
      <a href="about.html">About Us</a>
      <a href="local-picks.html" class="active">Local Picks</a>
    </nav>

    <div class="nav-actions">
      <a href="#" class="nav-icon-link">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span>Visit Us</span>
      </a>
      <a href="#" class="nav-icon-link">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Account</span>
      </a>
      <a href="#" class="nav-icon-link cart-link">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
        <span class="cart-badge" id="nav-stamp-count">0</span>
      </a>
    </div>
  </header>

  <!-- Local Picks Layout -->
  <main style="padding: 2.5rem; max-width: 1400px; margin: 0 auto;">
    
    <div style="margin-bottom: 2.5rem; text-align: center;">
      <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem; letter-spacing: -0.5px; color: var(--primary-green); display: inline-flex; align-items: center; gap: 0.5rem; justify-content: center;">
        Local Picks & Staff Favorites
        <svg style="width: 32px; height: 32px; stroke: var(--primary-green); fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.5 12 13 13 12"/></svg>
      </h1>
      <p style="color: var(--text-muted); max-width: 600px; margin: 0 auto;">Hand-selected titles, regional writer spotlights, and personal favorites recommended directly by our bookstore team.</p>
    </div>

    <!-- Staff Picks Inventory Container -->
    <section>
      <div id="local-picks-container" class="book-carousel" style="grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 2rem;">
        <!-- app.js will dynamically load staff picks here -->
      </div>
    </section>

  </main>

  <!-- Reservation Modal -->
  <div id="reserve-modal" class="modal hidden">
    <div class="modal-content">
      <button id="close-modal-btn" class="close-btn">&times;</button>
      <h2>Reserve for Pickup</h2>
      <h3 id="modal-book-title"></h3>
      
      <form id="reserve-form">
        <input type="hidden" id="modal-isbn" required>
        <label for="customer-name">Full Name</label>
        <input type="text" id="customer-name" placeholder="Jane Doe" required>
        <label for="customer-email">Email Address</label>
        <input type="email" id="customer-email" placeholder="jane@example.com" required>
        <label for="customer-phone">Phone Number (Optional)</label>
        <input type="tel" id="customer-phone" placeholder="555-123-4567">
        <div class="modal-actions">
          <button type="button" id="cancel-modal-btn" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Confirm Reservation</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
