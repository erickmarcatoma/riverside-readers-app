<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop All Books - Riverside Books</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>

  <!-- Top Navigation -->
  <header class="navbar">
    <div class="nav-brand">
      <img src="riversidebook.png" alt="Riverside Books Logo" class="brand-logo-img">
      <div class="brand-text">
        <span class="brand-title">RIVERSIDE BOOKS</span>
        <span class="brand-subtitle">INDEPENDENT & LOCAL</span>
      </div>
    </div>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Shop Books</a>
      <a href="about.html">About Us</a>
      <a href="local-picks.html">Local Picks</a>
    </nav>

    <div class="nav-actions">
      <a href="#" class="nav-icon-link">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Account</span>
      </a>
      <a href="#" class="nav-icon-link cart-link">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
        <span class="cart-badge" id="nav-stamp-count">0</span>
      </a>
    </div>
  </header>

  <!-- Shop Catalog Layout -->
  <main style="padding: 2.5rem; max-width: 1400px; margin: 0 auto;">
    
    <div style="margin-bottom: 2rem;">
      <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem; letter-spacing: -0.5px;">All Books Catalog</h1>
      <p style="color: var(--text-muted);">Explore our complete collection of thoughtfully chosen titles, local authors, and staff favorites.</p>
    </div>

    <!-- Filter Bar Row -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; background: white; padding: 1rem 1.5rem; border-radius: var(--border-radius-sm); border: 1px solid #eee; flex-wrap: wrap; gap: 1rem;">
      <div id="shop-filter-buttons" style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
        <span style="font-weight: 600; font-size: 0.9rem;">Filter by:</span>
        <button class="filter-btn" data-filter="all" style="padding: 0.4rem 1rem; border-radius: 20px; border: 1px solid var(--primary-green); background: var(--primary-green); color: white; cursor: pointer;">All Genres</button>
        <button class="filter-btn" data-filter="Fantasy" style="padding: 0.4rem 1rem; border-radius: 20px; border: 1px solid #ccc; background: white; cursor: pointer;">Fantasy</button>
        <button class="filter-btn" data-filter="Romance" style="padding: 0.4rem 1rem; border-radius: 20px; border: 1px solid #ccc; background: white; cursor: pointer;">Romance</button>
        <button class="filter-btn" data-filter="Science Fiction" style="padding: 0.4rem 1rem; border-radius: 20px; border: 1px solid #ccc; background: white; cursor: pointer;">Science Fiction</button>
        <button class="filter-btn" data-filter="Thriller" style="padding: 0.4rem 1rem; border-radius: 20px; border: 1px solid #ccc; background: white; cursor: pointer;">Thriller</button>
        <button class="filter-btn" data-filter="Memoir" style="padding: 0.4rem 1rem; border-radius: 20px; border: 1px solid #ccc; background: white; cursor: pointer;">Memoir</button>
      </div>
      <div>
        <select id="sort-select" style="padding: 0.5rem 1rem; border-radius: 20px; border: 1px solid #ccc; outline: none; background: white; cursor: pointer;">
          <option value="featured">Sort by: Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="alpha">Alphabetical (A-Z)</option>
        </select>
      </div>
    </div>

    <!-- Full Grid Inventory Container -->
    <section>
      <div id="full-inventory-container" class="book-carousel" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 2rem;">
        <!-- app.js populates inventory items here -->
      </div>
    </section>

  </main>

  <!-- Reservation Modal -->
  <div id="reserve-modal" class="modal hidden">
    <div class="modal-content">
      <button id="close-modal-btn" class="close-btn">&times;</button>
      <h2>Reserve for Pickup</h2>
      <h3 id="modal-book-title"></h3>
      
      <form id="reserve-form">
        <input type="hidden" id="modal-isbn" required>
        <label for="customer-name">Full Name</label>
        <input type="text" id="customer-name" placeholder="Jane Doe" required>
        <label for="customer-email">Email Address</label>
        <input type="email" id="customer-email" placeholder="jane@example.com" required>
        <label for="customer-phone">Phone Number (Optional)</label>
        <input type="tel" id="customer-phone" placeholder="555-123-4567">
        <div class="modal-actions">
          <button type="button" id="cancel-modal-btn" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Confirm Reservation</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
